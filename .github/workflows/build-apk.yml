name: Build Ionic Debug APK

on:
  push:
    branches: [ production ]
  workflow_dispatch: # Permet de lancer manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: mesFactures

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: mesFactures/package-lock.json
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Ionic CLI
      run: npm install -g @ionic/cli
      
    - name: Build Ionic app
      run: ionic build --prod
      
    - name: Add Android platform if missing
      run: |
        if [ ! -d "android" ]; then
          ionic capacitor add android
        else
          echo "Android platform already exists, skipping..."
        fi
      
    - name: Sync Capacitor
      run: ionic capacitor sync android
      
    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: mesFactures/android/app/build/outputs/apk/debug/app-debug.apk
